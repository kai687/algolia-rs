[package]
name = "algolia-rs"
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/kai687/algolia-rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.27.0"

[lints.clippy]
pedantic = "warn"

[profile.release]
strip = true
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
