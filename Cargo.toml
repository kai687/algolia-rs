[package]
name = "algolia-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytesize = "2.3.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
clap_complete_nushell = "4.6.0"
colored = "3.1.1"
dialoguer = "0.12.0"
dirs = "6.0.0"
futures = "0.3.32"
itertools = "0.14.0"
num-format = "0.4.4"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
tabled = { version = "0.20.0", features = ["derive"] }
thiserror = "2.0.18"
timeago = "0.6.0"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"

[dev-dependencies]
httpmock = "0.8.3"

[lints.clippy]
pedantic = "warn"

[profile.release]
strip = true
lto = true
