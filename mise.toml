[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Type-check all targets and features"
run = "cargo check --all-targets --all-features --locked"

[tasks.clippy]
description = "Run clippy with warnings denied"
run = "cargo clippy --all-targets --all-features --locked -- -D warnings"

[tasks.test]
description = "Run tests"
run = "cargo test --all-targets --all-features --locked"

[tasks.doc]
description = "Build docs with warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --all-features --no-deps --locked"

[tasks.build]
description = "Build release binary"
run = "cargo build --release --locked"

[tasks.ci]
description = "Run full CI pipeline"
depends = ["fmt-check", "check", "clippy", "test", "doc", "build"]

[tasks.fix]
description = "Format and apply clippy fixes"
run = [
  "cargo fmt --all",
  "cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged",
]
