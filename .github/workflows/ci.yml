name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Docs
        run: cargo doc --all-features --no-deps --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets --all-features --locked

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        run: |
          bin="target/${{ matrix.target }}/release/algolia-rs"
          "${bin}" --version
          "${bin}" settings diff --help > /dev/null
          # Missing credentials must exit 2
          set +e
          "${bin}" settings get idx
          code=$?
          set -e
          test "${code}" -eq 2
